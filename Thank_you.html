<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You After Sign-In</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightcyan;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px black;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: forestgreen;
            font-size: 2em;
        }

        p {
            color: gray;
            font-size: 1.2em;
        }

        .btn {
            background-color: forestgreen;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: forestgreen;
        }

        .message {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thank You for Signing In!</h1>
        <p>We appreciate your trust in us.</p>
        <div class="message">
            <a href="front_page.html"><button class="btn" onclick="goHome()">Go to Home</button></a>
        </div>
    </div>

</body>
</html>
